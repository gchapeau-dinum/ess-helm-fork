synapse:
  httpRoutes:
    additionalPaths:
    - path: /_matrix/from-routes
      availability: only_externally
      service:
        name: routes-svc
        port:
          number: 8080
    - path: /_matrix/routes-blocked
      availability: blocked
    - path: /_matrix/internal
      availability: internally_and_externally
      service:
        name: internal-svc
        port:
          number: 8080
